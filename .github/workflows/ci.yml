name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.x"
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
    - name: PyLint
      run: pipx run nox -s pylint

  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read  # to check out the repository
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.15"]
        runs-on: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - parallel:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

    - name: Install nox
      run: uv tool install nox

    # The parallel sessions share this cache, so a file must not download twice
    - name: Download test data
      run: >-
        uvx --from scikit-hep-testdata skhep-testdata
        ntpl001_staff_rntuple_v1-0-0-0.root
        test_1jag_int_float_rntuple_v1-0-0-0.root
        uproot-empty.root
        uproot-Event.root
        uproot-hepdata-example.root
        uproot-HZZ.root
        uproot-nesteddirs.root
        uproot-Zmumu-lz4.root

    - parallel:
      - name: Test package
        run: nox -s tests

      - name: Test with the image extra
        run: nox -s tests-image

      - name: Test minimum versions
        if: matrix.python-version == '3.11' || matrix.python-version == '3.13'
        run: nox -s minimums

  pass:
    name: Pass
    if: always()
    needs: [pre-commit, checks]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
