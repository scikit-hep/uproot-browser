ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"
  autoupdate_schedule: "monthly"

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-yaml
  - id: debug-statements
  - id: end-of-file-fixer
  - id: mixed-line-ending
  - id: requirements-txt-fixer
  - id: trailing-whitespace

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: "25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c"  # frozen: v0.17.3
  hooks:
    - id: ruff-check
      args: ["--fix", "--show-fixes"]
    - id: ruff-format

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c  # frozen: v2.4.1
  hooks:
  - id: mypy
    files: src
    additional_dependencies:
    - rich>=12
    - click
    - hist
    # 2.4+ stubs need python_version 3.12+, but we target 3.11
    - numpy<2.4
    - textual>=0.86

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    args: [-L, "hist,iterm"]

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
  hooks:
  - id: zizmor
    files: "^\\.github"
    args: [--persona=pedantic]

- repo: https://github.com/henryiii/flake8-lazy
  rev: 2db69f40494cc912ede966160695ede82eb6ebac  # frozen: v0.10.1
  hooks:
  - id: flake8-lazy
    args: ["--apply=set"]
    files: '^src'

- repo: local
  hooks:
  - id: disallow-caps
    name: Disallow improper capitalization
    language: pygrep
    entry: PyBind|Numpy|Cmake|CCache|Github|PyTest
    exclude: .pre-commit-config.yaml
